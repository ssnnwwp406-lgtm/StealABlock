# ============================================================
#                    STEAL A BLOCK
#                    Main Configuration
# ============================================================

# ============================================================
# GENERAL
# ============================================================

general:

  # Plugin language
  # Available: en, ar
  language: en

  # Enable debug messages in console
  debug: false


# ============================================================
# BASE SETTINGS
# ============================================================

base:

  # Amount of slots at Prestige 0
  starting-slots: 10

  # Amount of slots added per Prestige
  slots-per-prestige: 10

  # Floors at Prestige 0
  starting-floors: 1

  # Floors added per Prestige
  floors-per-prestige: 1


  # ----------------------------------------------------------
  # BASE LOCK
  # ----------------------------------------------------------

  lock:

    # Base open time at Rebirth 0
    # Unit: seconds
    default-time: 60

    # Extra open time for every Rebirth
    # Example:
    # Rebirth 0 = 60 seconds
    # Rebirth 1 = 80 seconds
    # Rebirth 2 = 100 seconds
    rebirth-bonus: 20

    # Automatically lock the base when the timer ends
    auto-lock: true

    # Can the owner manually lock the base?
    manual-lock: true

    # Can the owner manually open the base?
    manual-open: true


# ============================================================
# REBIRTH
# ============================================================

rebirth:

  # Starting Rebirth
  starting-level: 0

  # Income multiplier
  income-multiplier:

    0: 1.0
    1: 1.5
    2: 2.0
    3: 2.5
    4: 3.0
    5: 3.5
    6: 4.0
    7: 4.5
    8: 5.0
    9: 5.5
    10: 6.0


# ============================================================
# PRESTIGE
# ============================================================

prestige:

  # Starting Prestige
  starting-level: 0

  # Slots added every Prestige
  slots-per-level: 10

  # Floors added every Prestige
  floors-per-level: 1


# ============================================================
# BLOCK SPAWNER
# ============================================================

block-spawner:

  # Enable automatic block spawning
  enabled: true

  # Spawn blocks at every registered Base
  spawn-at-all-bases: true

  # Remove blocks when the plugin/server shuts down
  remove-on-shutdown: false

  # Maximum amount of spawned blocks per Base
  max-blocks-per-base: 50


# ============================================================
# RARITY SPAWN TIMES
# ============================================================

rarities:

  common:

    enabled: true

    # Spawn interval
    # Unit: seconds
    interval: 5


  uncommon:

    enabled: true

    interval: 10


  rare:

    enabled: true

    interval: 20


  epic:

    enabled: true

    # 8 minutes
    interval: 480


  legendary:

    enabled: true

    # 15 minutes
    interval: 900


  mythic:

    enabled: true

    # 30 minutes
    interval: 1800


  divine:

    enabled: true

    # 1 hour 30 minutes
    interval: 5400


  secret:

    enabled: true

    # 3 hours
    interval: 10800


# ============================================================
# BLOCK SETTINGS
# ============================================================

blocks:

  # Allow blocks to be sold
  selling: true

  # Allow blocks to be merged
  merging: true
