# ============================================================
#                    STEAL A BLOCK
#                    Main Configuration
# ============================================================


# ============================================================
# GENERAL
# ============================================================

general:

  # Default language
  # Available: en, ar
  language: en

  # Enable debug messages
  debug: false


# ============================================================
# PLAYER DATA
# ============================================================

data:

  # Automatically save player data
  auto-save: true

  # Auto-save interval in minutes
  auto-save-interval: 5

  # Save when player quits
  save-on-quit: true

  # Save when server shuts down
  save-on-shutdown: true

  # File used for player data
  file: players.yml


# ============================================================
# BASE
# ============================================================

base:

  # Starting slots
  starting-slots: 10

  # Slots added per Prestige
  slots-per-prestige: 10

  # Starting floors
  starting-floors: 1

  # Floors added per Prestige
  floors-per-prestige: 1

  # Automatically assign a free base
  auto-assign: true

  # Teleport player to their base when joining
  teleport-on-join: true


# ============================================================
# BASE LOCK
# ============================================================

base-lock:

  # Base is locked when the player joins
  locked-on-join: true

  # Base automatically locks after timer ends
  auto-lock: true

  # Allow owner to manually open the base
  manual-open: true

  # Allow owner to manually lock the base
  manual-lock: true

  # Base open time at Rebirth 0
  # Seconds
  default-time: 60

  # Extra seconds for every Rebirth
  rebirth-bonus-time: 20

  # Maximum opening time
  # Seconds
  max-time: 3600


# ============================================================
# REBIRTH
# ============================================================

rebirth:

  # Starting Rebirth
  starting-level: 0

  # Maximum Rebirth
  max-level: 40

  # Base lock bonus
  base-lock:

    # Rebirth 0 = 60 seconds
    default-time: 60

    # Every Rebirth adds 20 seconds
    bonus-per-rebirth: 20

  # Income multiplier
  income-multiplier:

    0: 1.0
    1: 1.5
    2: 2.0
    3: 2.5
    4: 3.0
    5: 3.5
    6: 4.0
    7: 4.5
    8: 5.0
    9: 5.5
    10: 6.0
    11: 6.5
    12: 7.0
    13: 7.5
    14: 8.0
    15: 8.5
    16: 9.0
    17: 9.5
    18: 10.0
    19: 10.5
    20: 11.0
    21: 11.5
    22: 12.0
    23: 12.5
    24: 13.0
    25: 13.5
    26: 14.0
    27: 14.5
    28: 15.0
    29: 15.5
    30: 16.0
    31: 16.5
