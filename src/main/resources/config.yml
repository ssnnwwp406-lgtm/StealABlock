# ============================================================
# PRESTIGE
# ============================================================

prestige:

  # Starting Prestige
  starting-level: 0

  # Slots added every Prestige
  slots-per-level: 10

  # Floors added every Prestige
  floors-per-level: 1

  # Prestige 0 = 10 Slots / 1 Floor
  # Prestige 1 = 20 Slots / 2 Floors
  # Prestige 2 = 30 Slots / 3 Floors


# ============================================================
# CONVEYOR
# ============================================================

conveyor:

  enabled: true

  # Conveyor speed
  # Blocks per second
  speed: 2.0

  # Maximum blocks on conveyor
  max-blocks: 30

  # Remove block when it reaches the end
  remove-at-end: true

  # Allow players to buy blocks
  buying: true

  # Allow players to interact with blocks
  interaction: true

  # Spawn point is controlled
